# Administrative access is available only from inside the container.
local all all peer

# Application access is restricted by database, role, and container address.
host immich immich 10.0.1.3/32 scram-sha-256

# Deny every other network connection, including the administrative role.
host all postgres 0.0.0.0/0 reject
host all all 0.0.0.0/0 reject
host all all ::0/0 reject
