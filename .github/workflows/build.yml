name: Build NixOS configurations

on:
  workflow_dispatch:

jobs:
  build-system:
    name: Build system (${{ matrix.host }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host:
          - computerone
          - portatilo
          - serverone
          - vps-proxy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH key for secrets repo
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: |
            ${{ secrets.NIX_SECRETS_DEPLOY_KEY }}
            ${{ secrets.FF_DEPLOY_KEY }}
            ${{ secrets.CALENDAR_PROXY_DEPLOY_KEY }}
            ${{ secrets.GIUOCO_DEL_DIVERTIMENTO_DEPLOY_KEY }}
            ${{ secrets.QUOTE_BOT_DEPLOY_KEY }}

      - name: Add github.com to known hosts
        run: ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Install Nix
        uses: ./.github/actions/setup-nix

      - name: Build ${{ matrix.host }}
        run: |
          nix build \
            --print-build-logs \
            ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel"

  build-home:
    name: Build home (${{ matrix.host }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host:
          - portatilo
          - computerone

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH key for secrets repo
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: |
            ${{ secrets.NIX_SECRETS_DEPLOY_KEY }}
            ${{ secrets.FF_DEPLOY_KEY }}
            ${{ secrets.CALENDAR_PROXY_DEPLOY_KEY }}
            ${{ secrets.GIUOCO_DEL_DIVERTIMENTO_DEPLOY_KEY }}
            ${{ secrets.QUOTE_BOT_DEPLOY_KEY }}

      - name: Add github.com to known hosts
        run: ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Install Nix
        uses: ./.github/actions/setup-nix

      - name: Build billy@${{ matrix.host }}
        run: |
          nix build \
            --print-build-logs \
            '.#homeConfigurations."billy@${{ matrix.host }}".activationPackage'
