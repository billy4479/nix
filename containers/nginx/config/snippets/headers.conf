include /etc/nginx/snippets/security-headers.conf;

# Advertise HTTP/3 on the same port (udp/443 is DNAT'd from the vps edge).
# Browsers only attempt h3 after seeing this over the tcp path, so a broken
# QUIC path degrades to h2 silently.
add_header Alt-Svc 'h3=":443"; ma=86400' always;

real_ip_header proxy_protocol;
