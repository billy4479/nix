# user  nginx; # Already run by a non-root user by nerdctl
worker_processes  auto;
pid /tmp/nginx.pid;
error_log /dev/stdout warn;

events { worker_connections 10240; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp_path;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  # nginx keeps no global temp budget: proxy_max_temp_file_size caps the
  # spill of a single response, so this is the only lever bounding the total.
  # 512m means ~4 concurrent max-spill transfers fit the 2g tmpfs (see the
  # nginx container tmpfs override); bigger responses still download fine,
  # their tail just streams client-paced.
  proxy_max_temp_file_size 512m;

  sendfile  on;
  tcp_nopush  on;
  keepalive_timeout 65;
  server_tokens off;

  set_real_ip_from @@EXTERNAL_TRAFFIC@@;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_types text/plain text/css application/json application/javascript application/xml+rss application/xml application/xhtml+xml image/svg+xml;
  gzip_proxied any;

  # log_format main '$remote_addr - $remote_user [$time_local] '
  #             '"$request" $status $body_bytes_sent '
  #             '"$http_referer" "$http_user_agent" '
  #             'rt=$request_time ra="$remote_addr" us="$upstream_status" '
  #             'ut="$upstream_response_time"';

  access_log /dev/stdout;

  # The generated per-service vhosts declare one explicit long server_name
  # each (the old wildcard layout had far fewer); the default bucket size
  # (64) is too small for names like giuoco-del-divertimento.internal...
  # and nginx would refuse to start. Found by `nix build .#nginx-config`.
  server_names_hash_bucket_size 128;
  map_hash_bucket_size 128;
  map_hash_max_size 8192;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
  }

  # Drop all unknown hosts. default_server matters on 4443 too: the SNI
  # demuxer forwards every TLS handshake there, and without a default nginx
  # would fall back to the first generated vhost listening on 4443
  # (alphabetical service order) instead of dropping the connection.
  server {
    listen 443 ssl default_server;
    listen 4443 ssl proxy_protocol default_server;
    http2 on;

    ssl_certificate     /certs/live/polpetta.online/fullchain.pem;
    ssl_certificate_key /certs/live/polpetta.online/privkey.pem;
    return 444;
  }

  # Upgrade to https
  server {
    listen 80;
    listen 81 proxy_protocol;
    server_name polpetta.online *.polpetta.online;

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # Prometheus scrapes this endpoint from the host through the nginx
  # exporter. Same CIDR policy as restrict_internal.conf.
  server {
    listen 10.0.1.6:8082;

    server_name _;

    access_log off;

    allow 100.64.0.0/10;
    allow 10.0.0.0/8;
    allow 192.168.0.0/16;
    deny  all;

    location = /stub_status {
      stub_status;
    }
  }

  # Per-service vhosts and the $backend map they proxy through, generated
  # from polpetta.services.
  include /etc/nginx/vhosts.conf;
}
