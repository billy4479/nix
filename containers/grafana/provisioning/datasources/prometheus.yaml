# Datasource for the dashboards provisioned from /etc/grafana/dashboards.
# 10.0.1.1 is the nerdctl0 bridge gateway, i.e. the host itself, where
# prometheus listens on port 9090 (allowed on the nerdctl0 interface only).
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://10.0.1.1:9090
    isDefault: true
    editable: false
